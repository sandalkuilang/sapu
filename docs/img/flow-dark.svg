<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-label="/sapu in 30 seconds: scope lock, drain open PRs, one lane per issue, review by an agent that is not the author with fix cycles, and a merge only on a green gate through sapu-merge.sh, one PR at a time. Every issue ends merged, skipped or blocked, each with a reason.">
  <title>/sapu in 30 seconds</title>
  <desc>Five steps from an open backlog to merged work. Step 0: the scope lock checks the gh account, origin and the allowed roots. Phase A: every open PR is reviewed, fixed or closed. Phase B: each open issue is one lane, where a forge worker in its own worktree opens a PR. Review: never by the author; the qa specialist at Opus/high, and an adversarial Opus pair on the red tier; findings go back to the worker in fix cycles. Merge: only on a green gate, through sapu-merge.sh, one PR at a time. Every issue ends merged, skipped with a reason, or blocked with a reason.</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#dbe3ee}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .canvas{fill:#0f1623;stroke:#263247;stroke-width:1}
    .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;fill:#a5b4fc}
    .h1{font-size:25px;font-weight:750;fill:#f1f5f9;letter-spacing:-.01em}
    .sub{font-size:13.5px;fill:#9fb0c6}
    .sec{font-size:15px;font-weight:700;fill:#f1f5f9}
    .sec2{font-size:12.5px;fill:#9fb0c6}
    .ttl{font-size:14px;font-weight:650;fill:#f1f5f9}
    .t{font-size:13px;fill:#dbe3ee}
    .tb{font-size:13px;font-weight:650;fill:#f1f5f9}
    .cap{font-size:12px;fill:#9fb0c6}
    .lbl{font-size:11.5px;font-weight:650;letter-spacing:.06em;fill:#9fb0c6}
    .chipt{font-size:11.5px;font-weight:600}
    .white{fill:#ffffff}
    .ink{fill:#f1f5f9} .muted{fill:#9fb0c6} .accent{fill:#a5b4fc} .tealt{fill:#5eead4}
    .card{fill:#172133;stroke:#2e3c55;stroke-width:1}
    .sunken{fill:#121a28;stroke:#253147;stroke-width:1}
    .chip{fill:#121a28;stroke:#2e3c55;stroke-width:1}
    .ar{stroke:#8796ad;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .ar-g{stroke:#22c55e;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .ar-a{stroke:#f59e0b;stroke-width:1.6;fill:none;stroke-dasharray:5 4;stroke-linecap:round;stroke-linejoin:round}
    .ar-b{stroke:#93c5fd;stroke-width:1.6;fill:none;stroke-dasharray:6 4;stroke-linecap:round}
    .ar-v{stroke:#a78bfa;stroke-width:1.6;fill:none;stroke-dasharray:6 4;stroke-linecap:round}
    .guard{stroke:#ef4444;stroke-width:1.4;fill:none;stroke-dasharray:2 4;stroke-linecap:round}
    .m-n{stroke:#8796ad} .m-g{stroke:#22c55e} .m-a{stroke:#f59e0b} .m-b{stroke:#93c5fd} .m-v{stroke:#a78bfa}
    .ico{fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
    .ico-n{stroke:#9fb0c6} .ico-w{stroke:#ffffff}
    .rule{stroke:#2e3c55;stroke-width:1}
    .c-blue{fill:#93c5fd} .k-blue{fill:#0f1e38;stroke:#2f5596;stroke-width:1.25} .s-blue{stroke:#93c5fd} .f-blue{fill:#93c5fd} .tile-blue{fill:#0f1e38;stroke:#2f5596;stroke-width:1}
    .c-green{fill:#4ade80} .k-green{fill:#0b2417;stroke:#1f7a45;stroke-width:1.25} .s-green{stroke:#22c55e} .f-green{fill:#22c55e} .tile-green{fill:#0b2417;stroke:#1f7a45;stroke-width:1}
    .c-amber{fill:#fbbf24} .k-amber{fill:#271c08;stroke:#8a5d12;stroke-width:1.25} .s-amber{stroke:#f59e0b} .f-amber{fill:#f59e0b} .tile-amber{fill:#271c08;stroke:#8a5d12;stroke-width:1}
    .c-red{fill:#fca5a5} .k-red{fill:#2a1216;stroke:#8f3434;stroke-width:1.25} .s-red{stroke:#ef4444} .f-red{fill:#ef4444} .tile-red{fill:#2a1216;stroke:#8f3434;stroke-width:1}
    .c-violet{fill:#c4b5fd} .k-violet{fill:#1c1736;stroke:#5b4aa3;stroke-width:1.25} .s-violet{stroke:#a78bfa} .f-violet{fill:#a78bfa} .tile-violet{fill:#1c1736;stroke:#5b4aa3;stroke-width:1}
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="brandbar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14b8a6"/><stop offset=".55" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.35"/><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/></filter>
    <marker id="mn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5,1.5 L8.5,5 L1.5,8.5" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="m-n"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5,1.5 L8.5,5 L1.5,8.5" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="m-g"/></marker><marker id="ma" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5,1.5 L8.5,5 L1.5,8.5" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="m-a"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5,1.5 L8.5,5 L1.5,8.5" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="m-b"/></marker><marker id="mv" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5,1.5 L8.5,5 L1.5,8.5" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="m-v"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="919" height="419" rx="20" class="canvas"/>
  <clipPath id="cv"><rect x="0" y="0" width="920" height="420" rx="20"/></clipPath>
  <rect x="0" y="0" width="920" height="4" fill="url(#brandbar)" clip-path="url(#cv)"/>
  <text x="32" y="46" class="eyebrow">ONE COMMAND · /sapu</text>
  <text x="32" y="78" class="h1">From open backlog to merged work</text>
  <text x="32" y="102" class="sub">Workers never merge. One script does, after the gate is green.</text>
  <rect x="32" y="132" width="152" height="150" rx="12" class="card" filter="url(#sh)"/>
  <rect x="48" y="148" width="34" height="34" rx="9.5625" class="tile-violet"/>
  <g transform="translate(54.375,154.375) scale(0.8854166666666667)"><path d="M7 11V8a5 5 0 0 1 10 0v3 M5.5 11h13v9.5h-13z M12 15v2.5" class="ico s-violet"/></g>
  <text x="48" y="206" class="lbl">STEP 0</text>
  <text x="48" y="228" class="ttl">Scope lock</text>
  <text x="48" y="249" class="cap">account, origin and</text>
<text x="48" y="266" class="cap">allowed roots checked</text>
  <path d="M189,207 L203,207" class="ar" marker-end="url(#mn)"/>
  <rect x="208" y="132" width="152" height="150" rx="12" class="card" filter="url(#sh)"/>
  <rect x="224" y="148" width="34" height="34" rx="9.5625" class="tile-blue"/>
  <g transform="translate(230.375,154.375) scale(0.8854166666666667)"><path d="M6 4.5a2 2 0 1 0 0.01 0 M6 15.5a2 2 0 1 0 0.01 0 M18 15.5a2 2 0 1 0 0.01 0 M6 8.5v7 M18 15.5V10a3 3 0 0 0-3-3h-4 M13 4.5L10.5 7 13 9.5" class="ico s-blue"/></g>
  <text x="224" y="206" class="lbl">PHASE A</text>
  <text x="224" y="228" class="ttl">Drain open PRs</text>
  <text x="224" y="249" class="cap">every open PR:</text>
<text x="224" y="266" class="cap">review, fix or close</text>
  <path d="M365,207 L379,207" class="ar" marker-end="url(#mn)"/>
  <rect x="384" y="132" width="152" height="150" rx="12" class="card" filter="url(#sh)"/>
  <rect x="400" y="148" width="34" height="34" rx="9.5625" class="tile-violet"/>
  <g transform="translate(406.375,154.375) scale(0.8854166666666667)"><path d="M4 6h12 M4 12h16 M4 18h9 M14 3.5L16.5 6 14 8.5 M18 9.5L20.5 12 18 14.5 M11 15.5L13.5 18 11 20.5" class="ico s-violet"/></g>
  <text x="400" y="206" class="lbl">PHASE B</text>
  <text x="400" y="228" class="ttl">A lane per issue</text>
  <text x="400" y="249" class="cap">forge worker in its</text>
<text x="400" y="266" class="cap">own worktree, one PR</text>
  <path d="M541,207 L555,207" class="ar" marker-end="url(#mn)"/>
  <rect x="560" y="132" width="152" height="150" rx="12" class="card" filter="url(#sh)"/>
  <rect x="576" y="148" width="34" height="34" rx="9.5625" class="tile-amber"/>
  <g transform="translate(582.375,154.375) scale(0.8854166666666667)"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12z M12 9.2a2.8 2.8 0 1 0 0.01 0" class="ico s-amber"/></g>
  <text x="576" y="206" class="lbl">REVIEW</text>
  <text x="576" y="228" class="ttl">Never the author</text>
  <text x="576" y="249" class="cap">qa at Opus/high;</text>
<text x="576" y="266" class="cap">red: an Opus pair</text>
  <path d="M717,207 L731,207" class="ar" marker-end="url(#mn)"/>
  <rect x="736" y="132" width="152" height="150" rx="12" class="card" filter="url(#sh)"/>
  <rect x="752" y="148" width="34" height="34" rx="9.5625" class="tile-green"/>
  <g transform="translate(758.375,154.375) scale(0.8854166666666667)"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.2-7.5 9.5-4.3-1.3-7.5-4.9-7.5-9.5V6z M8.8 12.2l2.3 2.3 4.3-4.6" class="ico s-green"/></g>
  <text x="752" y="206" class="lbl">MERGE</text>
  <text x="752" y="228" class="ttl">Green gate only</text>
  <text x="752" y="249" class="cap"><tspan class="mono">sapu-merge.sh</tspan>,</text>
<text x="752" y="266" class="cap">one PR at a time</text>
  <path d="M636,284 L636.0,298.0 Q636,306 628.0,306.0 L468.0,306.0 Q460,306 460.0,298.0 L460,288" class="ar-a" marker-end="url(#ma)"/>
  <text x="548" y="324" class="cap" text-anchor="middle">findings → fix cycles</text>
  <path d="M812,284 L812,336" class="ar-g" marker-end="url(#mg)"/>
  <rect x="32" y="340" width="856" height="52" rx="14" class="k-green" />
  <rect x="46" y="350" width="32" height="32" rx="9" class="tile-green"/>
  <g transform="translate(52,356) scale(0.8333333333333334)"><path d="M12 3a9 9 0 1 0 0.01 0 M8 12.3l2.8 2.8 5.2-5.6" class="ico s-green"/></g>
  <text x="90" y="371" class="t"><tspan class="tb">Backlog clean.</tspan>  Every issue ends <tspan class="tb">merged</tspan>, <tspan class="tb">skipped</tspan> (with a reason) or <tspan class="tb">blocked</tspan> (with a reason).</text>
</svg>
