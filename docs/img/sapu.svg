<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1244" role="img" aria-label="The sapu orchestrator: Step 0 scope-locks the run; Phase A drains every open PR; Phase B works each open issue as one Workflow call, several lanes in parallel, where a forge worker opens a PR in its own worktree, the qa specialist or a red Opus pair reviews it, and up to two fix cycles or a step-budget handoff follow; ready PRs go through a merge queue in sapu-merge.sh (gate, flake ledger, merge, mergeAfter); each session ends by rewriting the sapu-sweep-state memory page, plus a cleanup when the repo's policy says session; the last session runs the cleanup the policy sets, a final full gate and the final report. Workers never merge.">
  <title>/sapu — the backlog orchestrator</title>
  <desc>Step 0 runs the scope lock and reads the profile and policy. Phase A drains all open PRs: inventory, classify (READY, NEEDS-FIX, STALE, DRAFT, NEEDS-AI), review by risk tier, then merge through sapu-merge.sh; a PR closed as STALE, or blocked after two fix cycles, is not merged. Phase B triages open issues (SKIP, DUPLICATE, POLICY GAP, WORK) and runs each WORK issue as one Workflow call of sapu-wave.js, a lane: up to `lanes` in flight (1 to 4, computed from the machine), and a new lane starts as soon as one returns. In a lane a forge worker from the ladder implements the issue in its own worktree and opens a PR; the qa specialist reviews every tier at Opus/high, and a red issue, a red-area diff, an unrun red-area check or the worker's own red-area report brings in an adversarial Opus pair (qa plus a domain specialist). Findings get up to two fix cycles with a delta re-review; a judgment call escalates one step up the ladder once; a worker past 120 tool calls hands off to a fresh worker of the same tier, at most twice per step. Ready PRs enter the merge queue: one sapu-merge.sh run at a time, in the background, awaited by notification; it runs the gate, records every run in the flake ledger, merges and calls mergeAfter. A red gate is never merged and is re-run at most once; red again, the failing files run on origin/base, where red means a base flake with one flake issue, fixed at its source. The end-of-wave net runs the full suite on the base branch at the cadence the profile sets. When a session reaches its context limit, it rewrites the sapu-sweep-state memory page (one page, at most 40 lines, open items only), cleans up when the repo's policy.cleanup is session, and the owner starts a fresh session that resumes from that page. The last session, with no work and no open PR left, cleans up unless the policy is never, runs a final full gate and writes the final report. The policy is set once in /sapu:init. Cleanup runs sapu-cleanup.mjs, which prints its plan, then with --apply deletes only sapu's own branches proven merged and removes only their clean worktrees. The guard hook checks every subagent, never the orchestrator.</desc>
  <style>
    :root{
      --bg:#f4f7fc; --ink:#18212f; --muted:#4d596c; --panel:#ffffff; --panel2:#e9eff9; --edge:#8390a6;
      --reads:#1f5fd6; --writes:#0d7a4d; --limit:#b3261e; --accent:#6a43c8;
      --readsfill:#e3edff; --writesfill:#dcf3e8; --limitfill:#fce8e5; --accentfill:#efe8fc;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#0f1522; --ink:#e8edf7; --muted:#a6b1c4; --panel:#1a2232; --panel2:#232d41; --edge:#5a677e;
        --reads:#86abff; --writes:#62d49a; --limit:#ff8f84; --accent:#c3a9ff;
        --readsfill:#17294a; --writesfill:#10301f; --limitfill:#3b1b18; --accentfill:#261f3d;
      }
    }
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--ink)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .bg{fill:var(--bg)}
    .h{font-size:21px;font-weight:700}
    .sub{font-size:13px;fill:var(--muted)}
    .sec{font-size:15px;font-weight:700;fill:var(--accent)}
    .ttl{font-size:14px;font-weight:700}
    .t{font-size:13px}
    .sm{font-size:12.5px;fill:var(--muted)}
    .c-limit{fill:var(--limit)} .c-accent{fill:var(--accent)}
    .box{fill:var(--panel);stroke:var(--edge);stroke-width:1.4}
    .box2{fill:var(--panel2);stroke:var(--edge);stroke-width:1.2}
    .reads-b{fill:var(--readsfill);stroke:var(--reads);stroke-width:1.5}
    .writes-b{fill:var(--writesfill);stroke:var(--writes);stroke-width:1.5}
    .limit-b{fill:var(--limitfill);stroke:var(--limit);stroke-width:1.5}
    .frame{fill:var(--accentfill);stroke:var(--accent);stroke-width:1.8}
    .flow{stroke:var(--ink);stroke-width:1.8;fill:none}
    .writes{stroke:var(--writes);stroke-width:1.8;fill:none}
    .loop{stroke:var(--limit);stroke-width:1.7;fill:none;stroke-dasharray:5 4}
    .ah-flow{fill:var(--ink)} .ah-writes{fill:var(--writes)} .ah-loop{fill:var(--limit)}
  </style>
  <defs>
    <marker id="af" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" class="ah-flow"/></marker>
    <marker id="aw" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" class="ah-writes"/></marker>
    <marker id="al" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" class="ah-loop"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="920" height="1244" rx="16"/>

  <text x="24" y="40" class="h">/sapu — sweep the backlog clean</text>
  <text x="24" y="62" class="sub">PRs first (Phase A), then issues in parallel lanes (Phase B). Only the orchestrator merges.</text>

  <!-- legend -->
  <rect x="24" y="80" width="872" height="36" rx="8" class="box"/>
  <line x1="40" y1="98" x2="68" y2="98" class="flow" marker-end="url(#af)"/>
  <text x="76" y="102" class="sm">flow</text>
  <line x1="170" y1="98" x2="198" y2="98" class="loop" marker-end="url(#al)"/>
  <text x="206" y="102" class="sm">fix / retry loop</text>
  <line x1="380" y1="98" x2="408" y2="98" class="writes" marker-end="url(#aw)"/>
  <text x="416" y="102" class="sm">produces</text>
  <rect x="540" y="91" width="26" height="14" rx="3" class="limit-b"/>
  <text x="574" y="102" class="sm">hard limit</text>

  <!-- step 0 -->
  <rect x="24" y="132" width="872" height="40" rx="8" class="reads-b"/>
  <text x="40" y="157" class="t"><tspan class="ttl">Step 0 · scope lock</tspan> — <tspan class="mono">sapu-contract.mjs check</tspan> (gh account · git email · origin · allowed roots) · read profile + policy</text>

  <!-- Phase A -->
  <text x="24" y="204" class="sec">Phase A · drain every open PR (one session)</text>
  <rect x="24" y="216" width="112" height="68" rx="8" class="box"/>
  <text x="80" y="244" class="t" text-anchor="middle">inventory</text>
  <text x="80" y="264" class="sm" text-anchor="middle">open PRs</text>

  <rect x="163" y="216" width="200" height="68" rx="8" class="box2"/>
  <text x="263" y="237" class="t" text-anchor="middle">classify each PR</text>
  <text x="263" y="256" class="sm" text-anchor="middle">READY · NEEDS-FIX · STALE</text>
  <text x="263" y="274" class="sm" text-anchor="middle">DRAFT · NEEDS-AI</text>

  <rect x="390" y="216" width="170" height="68" rx="8" class="box2"/>
  <text x="475" y="244" class="t" text-anchor="middle">review by tier</text>
  <text x="475" y="264" class="sm" text-anchor="middle">author ≠ reviewer</text>

  <rect x="587" y="216" width="146" height="68" rx="8" class="limit-b"/>
  <text x="660" y="244" class="t" text-anchor="middle">merge gate</text>
  <text x="660" y="264" class="sm mono" text-anchor="middle">sapu-merge.sh</text>

  <rect x="760" y="216" width="136" height="68" rx="8" class="writes-b"/>
  <text x="828" y="244" class="t" text-anchor="middle">merged</text>
  <text x="828" y="264" class="sm" text-anchor="middle">to base</text>

  <path d="M136,250 L161,250" class="flow" marker-end="url(#af)"/>
  <path d="M363,250 L388,250" class="flow" marker-end="url(#af)"/>
  <path d="M560,250 L585,250" class="flow" marker-end="url(#af)"/>
  <path d="M733,250 L758,250" class="writes" marker-end="url(#aw)"/>
  <path d="M475,284 L475,302 L263,302 L263,288" class="loop" marker-end="url(#al)"/>
  <text x="369" y="322" class="sm" text-anchor="middle">NEEDS-FIX → fix, then re-verify (≤ 2 cycles)</text>

  <path d="M200,284 L200,335 L585,335" class="flow" marker-end="url(#af)"/>
  <rect x="587" y="312" width="309" height="46" rx="8" class="box"/>
  <text x="603" y="330" class="t">not merged: STALE closed at classify</text>
  <text x="603" y="348" class="sm">· blocked (reason) after ≤ 2 fix cycles</text>
  <text x="896" y="380" class="sm" text-anchor="end">then Phase B in the same session while context is under 600k, else a fresh one</text>

  <!-- Phase B -->
  <text x="24" y="404" class="sec">Phase B · work open issues, one lane per issue</text>
  <rect x="24" y="422" width="170" height="96" rx="8" class="box2"/>
  <text x="109" y="446" class="t" text-anchor="middle">inventory + triage</text>
  <text x="109" y="466" class="sm" text-anchor="middle">SKIP · DUPLICATE</text>
  <text x="109" y="484" class="sm" text-anchor="middle">POLICY GAP</text>
  <text x="109" y="502" class="sm" text-anchor="middle">WORK (tier + worker)</text>
  <path d="M194,462 L222,462" class="flow" marker-end="url(#af)"/>

  <rect x="224" y="422" width="548" height="358" rx="12" class="frame"/>
  <text x="240" y="446" class="ttl c-accent">Lane — one Workflow call per issue (sapu-wave.js)</text>
  <text x="240" y="468" class="sm">own worktree · ≤ lanes in flight (1–4, per machine) · refilled as each returns</text>

  <rect x="240" y="482" width="156" height="58" rx="8" class="box"/>
  <text x="318" y="506" class="t" text-anchor="middle">forge worker</text>
  <text x="318" y="526" class="sm" text-anchor="middle">plan · TDD · open PR</text>
  <path d="M396,511 L422,511" class="flow" marker-end="url(#af)"/>

  <rect x="424" y="482" width="156" height="58" rx="8" class="box"/>
  <text x="502" y="506" class="t" text-anchor="middle">review by tier</text>
  <text x="502" y="526" class="sm" text-anchor="middle">never the author</text>
  <path d="M580,511 L606,511" class="writes" marker-end="url(#aw)"/>

  <rect x="608" y="482" width="148" height="58" rx="8" class="writes-b"/>
  <text x="682" y="506" class="t" text-anchor="middle">ready PR</text>
  <text x="682" y="526" class="sm" text-anchor="middle">not merged here</text>

  <path d="M502,540 L502,558 L318,558 L318,544" class="loop" marker-end="url(#al)"/>
  <text x="410" y="578" class="sm" text-anchor="middle">findings → fix + delta re-review (≤ 2 cycles)</text>
  <text x="240" y="600" class="sm">ESCALATE → one worker up the ladder, once; then blocked</text>
  <text x="240" y="620" class="sm">past 120 tool calls → handoff: WIP commit, fresh worker of the same tier (≤ 2)</text>

  <text x="240" y="648" class="ttl">Reviewer: never the author, never a ladder worker</text>
  <rect x="240" y="658" width="516" height="30" rx="7" class="box"/>
  <circle cx="256" cy="673" r="6" fill="#2f9e44"/>
  <circle cx="272" cy="673" r="6" fill="#e8a72b"/>
  <text x="286" y="678" class="t">green · yellow → qa specialist (Opus/high)</text>
  <rect x="240" y="694" width="516" height="30" rx="7" class="box"/>
  <circle cx="256" cy="709" r="6" fill="#d1453b"/>
  <text x="286" y="714" class="t">red → adversarial Opus pair: qa + domain specialist</text>
  <text x="240" y="744" class="sm">raised to the pair by a red-area diff, an unrun check, or the worker's red areas</text>
  <text x="240" y="764" class="sm">worker by difficulty: sonnet-medium … opus-high (red ≥ sonnet-high)</text>

  <!-- merge queue, outside the lane -->
  <path d="M756,511 L788,511" class="writes" marker-end="url(#aw)"/>
  <rect x="790" y="476" width="106" height="186" rx="8" class="limit-b"/>
  <text x="843" y="498" class="t" text-anchor="middle">merge queue</text>
  <text x="843" y="516" class="sm" text-anchor="middle">one at a time</text>
  <text x="843" y="532" class="sm" text-anchor="middle">background,</text>
  <text x="843" y="548" class="sm" text-anchor="middle">no polling</text>
  <text x="843" y="574" class="sm mono" text-anchor="middle" style="font-size:11px">sapu-merge.sh</text>
  <text x="843" y="596" class="sm" text-anchor="middle">· gate</text>
  <text x="843" y="614" class="sm" text-anchor="middle">· flake ledger</text>
  <text x="843" y="632" class="sm" text-anchor="middle">· merge</text>
  <text x="843" y="650" class="sm" text-anchor="middle">· mergeAfter</text>
  <path d="M843,662 L843,686" class="writes" marker-end="url(#aw)"/>
  <rect x="790" y="688" width="106" height="52" rx="8" class="writes-b"/>
  <text x="843" y="711" class="t" text-anchor="middle">merged</text>
  <text x="843" y="730" class="sm" text-anchor="middle">to base</text>

  <!-- red gate, flakes, net -->
  <rect x="24" y="796" width="872" height="76" rx="9" class="box"/>
  <text x="40" y="818" class="t"><tspan class="ttl c-limit">Gate red = no merge</tspan> · at most one re-run per PR · every run goes to the flake ledger <tspan class="mono">.git/sapu-gates.log</tspan></text>
  <text x="40" y="840" class="sm">red again → the failing test files on origin/&lt;base&gt;: red there too = a base flake → one "flake: &lt;file&gt;" issue, fixed at its source</text>
  <text x="40" y="860" class="sm">end-of-wave net: full suite on origin/&lt;base&gt; every 4th merge + when the queue drains (profile: other cadence, or none)</text>

  <!-- end of each session -->
  <text x="24" y="904" class="sec">End of each session · context past 750k (600k when Phase A ends)</text>
  <rect x="24" y="916" width="200" height="70" rx="8" class="box2"/>
  <text x="124" y="938" class="t" text-anchor="middle">session limit reached</text>
  <text x="124" y="957" class="sm" text-anchor="middle">checked between waves,</text>
  <text x="124" y="975" class="sm" text-anchor="middle">never inside a lane</text>
  <path d="M224,951 L246,951" class="flow" marker-end="url(#af)"/>

  <rect x="248" y="916" width="200" height="70" rx="8" class="box"/>
  <text x="348" y="938" class="t" text-anchor="middle">rewrite <tspan class="mono">sapu-sweep-state</tspan></text>
  <text x="348" y="957" class="sm" text-anchor="middle">one memory page, ≤ 40 lines</text>
  <text x="348" y="975" class="sm" text-anchor="middle">open items only</text>
  <path d="M448,951 L470,951" class="flow" marker-end="url(#af)"/>

  <rect x="472" y="916" width="200" height="70" rx="8" class="box"/>
  <text x="572" y="938" class="t" text-anchor="middle">cleanup, if policy = session</text>
  <text x="572" y="957" class="sm" text-anchor="middle">plan, then --apply</text>
  <text x="572" y="975" class="sm" text-anchor="middle">(default: only at Finish)</text>
  <path d="M672,951 L694,951" class="flow" marker-end="url(#af)"/>

  <rect x="696" y="916" width="200" height="70" rx="8" class="writes-b"/>
  <text x="796" y="938" class="t" text-anchor="middle">owner starts a fresh /sapu</text>
  <text x="796" y="957" class="sm" text-anchor="middle">new PRs first, then issues,</text>
  <text x="796" y="975" class="sm" text-anchor="middle">resuming from the page</text>

  <!-- finish -->
  <text x="24" y="1018" class="sec">Finish · the last session</text>
  <rect x="24" y="1030" width="200" height="56" rx="8" class="box2"/>
  <text x="124" y="1053" class="t" text-anchor="middle">no WORK, no open PR left</text>
  <text x="124" y="1073" class="sm" text-anchor="middle">only SKIP/BLOCKED left</text>
  <path d="M224,1058 L246,1058" class="flow" marker-end="url(#af)"/>

  <rect x="248" y="1030" width="200" height="56" rx="8" class="box"/>
  <text x="348" y="1053" class="t" text-anchor="middle">cleanup per policy</text>
  <text x="348" y="1073" class="sm" text-anchor="middle">finish (default) · never: skip</text>
  <path d="M448,1058 L470,1058" class="flow" marker-end="url(#af)"/>

  <rect x="472" y="1030" width="200" height="56" rx="8" class="limit-b"/>
  <text x="572" y="1053" class="t" text-anchor="middle">final full gate</text>
  <text x="572" y="1073" class="sm" text-anchor="middle">on origin/&lt;base&gt;</text>
  <path d="M672,1058 L694,1058" class="writes" marker-end="url(#aw)"/>

  <rect x="696" y="1030" width="200" height="56" rx="8" class="writes-b"/>
  <text x="796" y="1053" class="t" text-anchor="middle">final report</text>
  <text x="796" y="1073" class="sm" text-anchor="middle">PR + issue tables, metrics</text>

  <text x="24" y="1110" class="sm">Cleanup = <tspan class="mono">sapu-cleanup.mjs</tspan> (plan, then <tspan class="mono">--apply</tspan>) when <tspan class="mono">policy.cleanup</tspan>, set once in /sapu:init, says so: only sapu's own branches</text>
  <text x="24" y="1128" class="sm">(&lt;type&gt;/issue-&lt;N&gt;-…, worktree-wf_*, worktree-agent-*, sapu-*) proven merged; worktrees only when clean, never --force.</text>

  <rect x="24" y="1146" width="872" height="78" rx="9" class="limit-b"/>
  <text x="40" y="1170" class="t"><tspan class="ttl c-limit">Guard hook</tspan> checks every subagent's shell, file, search and MCP tool calls — never the orchestrator's.</text>
  <text x="40" y="1191" class="t">Workers never merge or touch the main checkout, the repo's protected DBs (contract guard), or real env files.</text>
  <text x="40" y="1211" class="t">Past 120 tool calls it reminds a worker to hand off. It stops honest mistakes; it is not a sandbox.</text>
</svg>
