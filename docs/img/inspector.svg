  <rect x="329" y="236" width="262" height="210" rx="14" class="card" filter="url(#sh)"/>
  <rect x="345" y="252" width="36" height="36" rx="10.125" fill="url(#brand)"/>
  <g transform="translate(351.75,258.75) scale(0.9375)"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12z M12 9.2a2.8 2.8 0 1 0 0.01 0" class="ico ico-w"/></g>
  <text x="393" y="268" class="ttl mono">argus</text>
  <text x="393" y="286" class="cap">phase 2</text>
  <rect x="480" y="258" width="97" height="22" rx="11" class="k-violet"/>
  <text x="490" y="273" class="chipt c-violet">Sonnet / high</text>
  <text x="345" y="318" class="cap">QA hunt on that baseline</text>
<text x="345" y="337" class="cap">one bounded cycle</text>
  <rect x="345" y="400" width="230" height="30" rx="8" class="k-green" />
  <text x="357" y="420" class="cap c-green">→ files GitHub issues</text>
  <path d="M596,276 L621,276" class="ar" marker-end="url(#mn)"/>
  <rect x="626" y="236" width="262" height="210" rx="14" class="card" filter="url(#sh)"/>
  <rect x="642" y="252" width="36" height="36" rx="10.125" fill="url(#brand)"/>
  <g transform="translate(648.75,258.75) scale(0.9375)"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.2-7.5 9.5-4.3-1.3-7.5-4.9-7.5-9.5V6z" class="ico ico-w"/></g>
  <text x="690" y="268" class="ttl mono">nemesis</text>
  <text x="690" y="286" class="cap">phase 3</text>
  <rect x="789" y="258" width="85" height="22" rx="11" class="k-violet"/>
  <text x="799" y="273" class="chipt c-violet">Opus / high</text>
  <text x="642" y="318" class="cap">red-team the live dev app</text>
<text x="642" y="337" class="cap">runs last — most aggressive</text>
<text x="642" y="356" class="cap">hard gate checked first</text>
  <text x="642" y="375" class="cap c-red">fail → the phase returns blocked</text>
  <rect x="642" y="400" width="230" height="30" rx="8" class="k-green" />
  <text x="654" y="420" class="cap c-green">→ files GitHub issues</text>
  <path d="M163,448 L163.0,464.0 Q163,472 171.0,472.0 L452.0,472.0 Q460,472 460.0,464.0 L460,452" class="ar-v" marker-end="url(#mv)"/>
  <path d="M460,472 L749.0,472.0 Q757,472 757.0,464.0 L757,452" class="ar-v" marker-end="url(#mv)"/>
  <text x="175" y="494" class="cap c-violet">momus's business-process gap rows → priority live targets for argus and nemesis</text>
  <rect x="32" y="516" width="856" height="60" rx="12" class="k-violet" />
  <rect x="44" y="529" width="34" height="34" rx="9.5625" class="tile-violet"/>
  <g transform="translate(50.375,535.375) scale(0.8854166666666667)"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.2-7.5 9.5-4.3-1.3-7.5-4.9-7.5-9.5V6z M8.8 12.2l2.3 2.3 4.3-4.6" class="ico s-violet"/></g>
  <text x="90" y="542" class="t"><tspan class="tb">Security bar</tspan>  appended to every phase prompt</text>
  <text x="90" y="561" class="cap">ASVS 5.0 · NIST SP 800-63B-4 · CIS · data-protection law · outsider + insider · known gaps from the security epic</text>
  <rect x="32" y="596" width="420" height="150" rx="14" class="card" filter="url(#sh)"/>
  <text x="48" y="624" class="ttl">Scoped run only</text>
  <text x="164.96000000000004" y="624" class="cap">read-only team review</text>
  <rect x="48" y="644" width="116" height="58" rx="10" class="sunken" />
  <text x="106" y="668" class="tb" text-anchor="middle">product</text>
  <text x="106" y="688" class="cap" text-anchor="middle">parallel</text>
  <rect x="178" y="644" width="116" height="58" rx="10" class="sunken" />
  <text x="236" y="668" class="tb" text-anchor="middle">ux</text>
  <text x="236" y="688" class="cap" text-anchor="middle">parallel</text>
  <rect x="328" y="644" width="116" height="58" rx="10" class="sunken" />
  <text x="386" y="668" class="tb" text-anchor="middle">qa / tests</text>
  <text x="386" y="688" class="cap" text-anchor="middle">alone, runs suites</text>
  <path d="M298,673 L324,673" class="ar" marker-end="url(#mn)"/>
  <text x="48" y="728" class="cap">product and ux in parallel, then qa / tests alone</text>
  <rect x="468" y="596" width="420" height="150" rx="14" class="k-green" />
  <text x="484" y="624" class="ttl">One combined result</text>
  <text x="628.26" y="624" class="cap">after nemesis (+ the team, if scoped)</text>
  <text x="484" y="654" class="t">· momus report + severity counts</text>
<text x="484" y="678" class="t">· argus + nemesis issue numbers</text>
<text x="484" y="702" class="t">· security roll-up: attacker + ASVS IDs</text>
  <rect x="32" y="766" width="856" height="106" rx="14" class="k-red" />
  <rect x="44" y="782" width="34" height="34" rx="9.5625" class="tile-red"/>
  <g transform="translate(50.375,788.375) scale(0.8854166666666667)"><path d="M8.5 3h7L21 8.5v7L15.5 21h-7L3 15.5v-7z M9 9l6 6 M15 9l-6 6" class="ico s-red"/></g>
  <text x="90" y="796" class="t"><tspan class="tb c-red">Rails</tspan>  each phase keeps its own gates: momus evidence rules · argus ORIENT checks · nemesis authorization gate</text>
  <text x="90" y="818" class="cap">A phase its own gate stopped returns blocked (nemesis files [NEMESIS][BLOCKED]) and the sequence continues;</text>
<text x="90" y="836" class="cap">a phase that returns nothing stops the sequence.</text>
<text x="90" y="854" class="cap">inspector has no state or findings of its own — each phase keeps <tspan class="mono">.momus/ .argus/ .nemesis/</tspan></text>
</svg>
