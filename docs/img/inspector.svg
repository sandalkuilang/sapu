<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 772" role="img" aria-label="The inspector sequencer runs momus, then argus, then nemesis, each finished before the next starts and each on its own model and effort; momus's business-process gap rows become priority targets for argus and nemesis; a scoped run adds a read-only team review; the security bar is appended to every phase, and the run ends with one combined summary and a security roll-up.">
  <title>/inspector — momus, then argus, then nemesis</title>
  <desc>After a Step 0 scope lock and workflow arguments, inspector dispatches three phases strictly in order, each awaited before the next: momus on Opus/high establishes a read-only release-readiness baseline across areas A to I and files nothing here; argus on Sonnet/high hunts on that baseline and files issues; nemesis on Opus/high red-teams the live dev app last and files issues, after checking its hard gate — on a failed gate it files a BLOCKED issue and the phase returns blocked. Momus's business-process gap rows are handed to argus and nemesis as priority targets. A scoped run adds a read-only team review (product and ux in parallel, then qa/tests alone). The security bar is appended to every phase prompt. The run returns one combined result with a security roll-up by attacker and ASVS ID. A phase stopped by its own gate returns blocked and the sequence continues; a phase that returns nothing stops the sequence.</desc>
  <style>
    :root{
      --bg:#f4f7fc; --ink:#18212f; --muted:#4d596c; --panel:#ffffff; --panel2:#e9eff9; --edge:#8390a6;
      --reads:#1f5fd6; --writes:#0d7a4d; --limit:#b3261e; --accent:#6a43c8;
      --readsfill:#e3edff; --writesfill:#dcf3e8; --limitfill:#fce8e5; --accentfill:#efe8fc;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#0f1522; --ink:#e8edf7; --muted:#a6b1c4; --panel:#1a2232; --panel2:#232d41; --edge:#5a677e;
        --reads:#86abff; --writes:#62d49a; --limit:#ff8f84; --accent:#c3a9ff;
        --readsfill:#17294a; --writesfill:#10301f; --limitfill:#3b1b18; --accentfill:#261f3d;
      }
    }
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--ink)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .bg{fill:var(--bg)}
    .h{font-size:21px;font-weight:700}
    .sub{font-size:13px;fill:var(--muted)}
    .ttl{font-size:14px;font-weight:700}
    .badge{font-size:12.5px;font-weight:700;fill:var(--accent)}
    .t{font-size:13px}
    .sm{font-size:12.5px;fill:var(--muted)}
    .c-writes{fill:var(--writes)} .c-limit{fill:var(--limit)}
    .box{fill:var(--panel);stroke:var(--edge);stroke-width:1.4}
    .box2{fill:var(--panel2);stroke:var(--edge);stroke-width:1.2}
    .reads-b{fill:var(--readsfill);stroke:var(--reads);stroke-width:1.5}
    .writes-b{fill:var(--writesfill);stroke:var(--writes);stroke-width:1.5}
    .limit-b{fill:var(--limitfill);stroke:var(--limit);stroke-width:1.5}
    .flow{stroke:var(--ink);stroke-width:2;fill:none}
    .reads{stroke:var(--reads);stroke-width:1.7;fill:none;stroke-dasharray:6 4}
    .writes{stroke:var(--writes);stroke-width:1.8;fill:none}
    .ah-flow{fill:var(--ink)} .ah-reads{fill:var(--reads)} .ah-writes{fill:var(--writes)}
  </style>
  <defs>
    <marker id="af" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" class="ah-flow"/></marker>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" class="ah-reads"/></marker>
    <marker id="aw" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" class="ah-writes"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="920" height="772" rx="16"/>

  <text x="24" y="40" class="h">/inspector — one sequenced release + security sweep</text>
  <text x="24" y="62" class="sub">Three phases, each finished before the next starts, each on its own model and effort. Never parallel.</text>

  <!-- legend -->
  <rect x="24" y="80" width="872" height="36" rx="8" class="box"/>
  <line x1="40" y1="98" x2="68" y2="98" class="flow" marker-end="url(#af)"/>
  <text x="76" y="102" class="sm">sequence (awaited)</text>
  <line x1="250" y1="98" x2="278" y2="98" class="reads" marker-end="url(#ar)"/>
  <text x="286" y="102" class="sm">feeds priority targets</text>
  <line x1="480" y1="98" x2="508" y2="98" class="writes" marker-end="url(#aw)"/>
  <text x="516" y="102" class="sm">produces</text>
  <rect x="620" y="91" width="26" height="14" rx="3" class="limit-b"/>
  <text x="654" y="102" class="sm">hard limit</text>

  <!-- step 0 -->
  <rect x="24" y="132" width="872" height="40" rx="8" class="reads-b"/>
  <text x="40" y="157" class="t"><tspan class="ttl">Step 0</tspan> — <tspan class="mono">sapu-contract.mjs check</tspan> + <tspan class="mono">wave-args</tspan> · momus, argus, nemesis profiles committed</text>

  <!-- three phases -->
  <rect x="24" y="192" width="261" height="160" rx="10" class="box2"/>
  <text x="40" y="216" class="ttl">momus</text>
  <text x="269" y="216" class="badge" text-anchor="end">Opus / high</text>
  <text x="40" y="242" class="t">release-readiness baseline</text>
  <text x="40" y="262" class="sm">one read-only pass, areas A–I</text>
  <text x="40" y="282" class="sm">files nothing inside inspector</text>
  <text x="40" y="338" class="t c-writes">→ report + gap rows</text>

  <rect x="329" y="192" width="261" height="160" rx="10" class="box2"/>
  <text x="345" y="216" class="ttl">argus</text>
  <text x="574" y="216" class="badge" text-anchor="end">Sonnet / high</text>
  <text x="345" y="242" class="t">QA hunt on that baseline</text>
  <text x="345" y="262" class="sm">one bounded cycle</text>
  <text x="345" y="338" class="t c-writes">→ files GitHub issues</text>

  <rect x="635" y="192" width="261" height="160" rx="10" class="box2"/>
  <text x="651" y="216" class="ttl">nemesis</text>
  <text x="880" y="216" class="badge" text-anchor="end">Opus / high</text>
  <text x="651" y="242" class="t">red-team the live dev app</text>
  <text x="651" y="262" class="sm">runs last — most aggressive</text>
  <rect x="651" y="274" width="229" height="46" rx="6" class="limit-b"/>
  <text x="663" y="293" class="sm c-limit">hard gate checked first</text>
  <text x="663" y="311" class="sm">fail → phase returns blocked</text>
  <text x="651" y="338" class="t c-writes">→ files GitHub issues</text>

  <path d="M285,272 L327,272" class="flow" marker-end="url(#af)"/>
  <path d="M590,272 L633,272" class="flow" marker-end="url(#af)"/>

  <!-- gap rows -->
  <path d="M154,352 L154,376 L459,376 L459,355" class="reads" marker-end="url(#ar)"/>
  <path d="M459,376 L765,376 L765,355" class="reads" marker-end="url(#ar)"/>
  <text x="170" y="398" class="sm">momus's business-process gap rows → priority live targets for argus and nemesis</text>

  <!-- security bar -->
  <rect x="24" y="414" width="872" height="56" rx="8" class="reads-b"/>
  <text x="40" y="436" class="t"><tspan class="ttl">Security bar</tspan> — appended to every phase prompt</text>
  <text x="40" y="458" class="sm">ASVS 5.0 · NIST SP 800-63B-4 · CIS · data-protection law · outsider + insider · known gaps from the security epic</text>

  <!-- team review -->
  <rect x="24" y="488" width="520" height="124" rx="10" class="box"/>
  <text x="40" y="512" class="ttl">Scoped run only — read-only team review</text>
  <rect x="40" y="532" width="150" height="56" rx="8" class="box2"/>
  <text x="115" y="555" class="t" text-anchor="middle">product</text>
  <text x="115" y="574" class="sm" text-anchor="middle">parallel</text>
  <rect x="202" y="532" width="150" height="56" rx="8" class="box2"/>
  <text x="277" y="555" class="t" text-anchor="middle">ux</text>
  <text x="277" y="574" class="sm" text-anchor="middle">parallel</text>
  <path d="M352,560 L370,560" class="flow" marker-end="url(#af)"/>
  <rect x="372" y="532" width="156" height="56" rx="8" class="box2"/>
  <text x="450" y="555" class="t" text-anchor="middle">qa / tests</text>
  <text x="450" y="574" class="sm" text-anchor="middle">alone, runs suites</text>

  <!-- combined result -->
  <path d="M544,550 L566,550" class="writes" marker-end="url(#aw)"/>
  <rect x="568" y="488" width="328" height="124" rx="10" class="writes-b"/>
  <text x="584" y="512" class="ttl">One combined result</text>
  <text x="584" y="532" class="sm">after nemesis (and the team, if scoped)</text>
  <text x="584" y="554" class="t">momus report + severity counts</text>
  <text x="584" y="574" class="t">argus + nemesis issue numbers</text>
  <text x="584" y="594" class="t">security roll-up: attacker + ASVS IDs</text>

  <!-- rails -->
  <rect x="24" y="630" width="872" height="122" rx="10" class="box"/>
  <text x="40" y="653" class="ttl">Rails</text>
  <text x="40" y="675" class="t">Each phase keeps its own gates: momus evidence rules · argus ORIENT checks · nemesis authorization gate.</text>
  <text x="40" y="695" class="t">A phase its own gate stopped returns blocked (nemesis files <tspan class="mono">[NEMESIS][BLOCKED]</tspan>) and the sequence continues;</text>
  <text x="40" y="715" class="t">a phase that returns nothing stops the sequence.</text>
  <text x="40" y="737" class="sm">inspector has no state or findings of its own — each phase keeps <tspan class="mono">.momus/ .argus/ .nemesis/</tspan></text>
</svg>
