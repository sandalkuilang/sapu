  <circle cx="70" cy="423" r="13" class="tile-violet"/>
  <text x="70" y="427" class="chipt c-violet" text-anchor="middle">QA</text>
  <text x="92" y="428" class="t"><tspan class="tb">Senior QA</tspan><tspan class="muted"> — </tspan>boundaries, races</text>
