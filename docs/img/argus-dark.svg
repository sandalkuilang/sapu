  <g transform="translate(386.75,218.75) scale(0.9375)"><path d="M20 12a8 8 0 1 1-2.4-5.7 M20 4v4.5h-4.5" class="ico ico-w"/></g>
  <text x="428" y="228" class="ttl">The cycle</text>
  <text x="428" y="246" class="cap">eleven phases · each owes an artifact</text>
  <rect x="380" y="272" width="238" height="50" rx="10" class="sunken" />
  <circle cx="402" cy="297" r="12" fill="url(#brand)"/>
  <text x="402" y="301.5" class="white" text-anchor="middle" style="font-size:11.5px;font-weight:700">1</text>
  <text x="424" y="293" class="tb">ORIENT</text>
  <text x="424" y="311" class="cap">preflight passes</text>
  <rect x="380" y="332" width="238" height="50" rx="10" class="sunken" />
  <circle cx="402" cy="357" r="12" fill="url(#brand)"/>
  <text x="402" y="361.5" class="white" text-anchor="middle" style="font-size:11.5px;font-weight:700">2</text>
  <text x="424" y="353" class="tb">SELECT</text>
  <text x="424" y="371" class="cap">ranked area to probe</text>
  <rect x="380" y="392" width="238" height="50" rx="10" class="sunken" />
  <circle cx="402" cy="417" r="12" fill="url(#brand)"/>
  <text x="402" y="421.5" class="white" text-anchor="middle" style="font-size:11.5px;font-weight:700">3</text>
  <text x="424" y="413" class="tb">INTAKE</text>
  <text x="424" y="431" class="cap">sapu / forge residue</text>
  <rect x="380" y="452" width="238" height="50" rx="10" class="sunken" />
  <circle cx="402" cy="477" r="12" fill="url(#brand)"/>
  <text x="402" y="481.5" class="white" text-anchor="middle" style="font-size:11.5px;font-weight:700">4</text>
  <text x="424" y="473" class="tb">CHARTER</text>
  <text x="424" y="491" class="cap">plan + assumptions first</text>
  <rect x="380" y="512" width="238" height="50" rx="10" class="sunken" />
  <circle cx="402" cy="537" r="12" fill="url(#brand)"/>
  <text x="402" y="541.5" class="white" text-anchor="middle" style="font-size:11.5px;font-weight:700">5</text>
  <text x="424" y="533" class="tb">EXECUTE</text>
  <text x="424" y="551" class="cap">probe log + tier</text>
  <rect x="380" y="572" width="238" height="50" rx="10" class="sunken" />
  <circle cx="402" cy="597" r="12" fill="url(#brand)"/>
  <text x="402" y="601.5" class="white" text-anchor="middle" style="font-size:11.5px;font-weight:700">6</text>
  <text x="424" y="593" class="tb">OBSERVE</text>
  <text x="424" y="611" class="cap">read state back</text>
  <rect x="634" y="272" width="238" height="50" rx="10" class="sunken" />
  <circle cx="656" cy="297" r="12" fill="url(#brand)"/>
  <text x="656" y="301.5" class="white" text-anchor="middle" style="font-size:11.5px;font-weight:700">7</text>
  <text x="678" y="293" class="tb">MINIMIZE</text>
  <text x="678" y="311" class="cap">strip to minimal repro</text>
  <rect x="634" y="332" width="238" height="50" rx="10" class="sunken" />
  <circle cx="656" cy="357" r="12" fill="url(#brand)"/>
  <text x="656" y="361.5" class="white" text-anchor="middle" style="font-size:11.5px;font-weight:700">8</text>
  <text x="678" y="353" class="tb">TRIAGE</text>
  <text x="678" y="371" class="cap">candidates + refutation</text>
  <rect x="634" y="392" width="238" height="50" rx="10" class="sunken" />
  <circle cx="656" cy="417" r="12" fill="url(#brand)"/>
  <text x="656" y="421.5" class="white" text-anchor="middle" style="font-size:11.5px;font-weight:700">9</text>
  <text x="678" y="413" class="tb">REPORT</text>
  <text x="678" y="431" class="cap">file issues (gated)</text>
  <rect x="634" y="452" width="238" height="50" rx="10" class="sunken" />
  <circle cx="656" cy="477" r="12" fill="url(#brand)"/>
  <text x="656" y="481.5" class="white" text-anchor="middle" style="font-size:11.5px;font-weight:700">10</text>
  <text x="678" y="473" class="tb">PERSIST</text>
  <text x="678" y="491" class="cap">journal + fingerprints</text>
  <rect x="634" y="512" width="238" height="50" rx="10" class="sunken" />
  <circle cx="656" cy="537" r="12" fill="url(#brand)"/>
  <text x="656" y="541.5" class="white" text-anchor="middle" style="font-size:11.5px;font-weight:700">11</text>
  <text x="678" y="533" class="tb">ROTATE</text>
  <text x="678" y="551" class="cap">pin next cycle's lane</text>
  <text x="646" y="602" class="cap c-violet">one invocation = one bounded cycle</text>
  <rect x="32" y="660" width="520" height="166" rx="14" class="card" filter="url(#sh)"/>
  <text x="48" y="690" class="ttl">The law of evidence</text>
  <rect x="48" y="706" width="36" height="22" rx="11" class="k-green"/>
  <text x="58" y="721" class="chipt c-green">T1</text>
  <text x="98" y="721" class="t">observed — wire / DB / DOM</text>
  <rect x="48" y="732" width="36" height="22" rx="11" class="k-blue"/>
  <text x="58" y="747" class="chipt c-blue">T2</text>
  <text x="98" y="747" class="t">a command or test you ran</text>
  <rect x="48" y="758" width="36" height="22" rx="11" class="k-violet"/>
  <text x="58" y="773" class="chipt c-violet">T3</text>
  <text x="98" y="773" class="t">read in source at a commit</text>
  <rect x="48" y="784" width="36" height="22" rx="11" class="chip"/>
  <text x="58" y="799" class="chipt muted">T4</text>
  <text x="98" y="799" class="t">inferred from T1–T3</text>
  <rect x="330" y="706" width="206" height="98" rx="10" class="k-amber" />
  <text x="346" y="732" class="tb c-amber">S1 / S2 need</text>
  <text x="346" y="752" class="tb c-amber">≥ 1 T1 item</text>
  <text x="346" y="782" class="cap">falsify before filing</text>
  <rect x="568" y="660" width="320" height="166" rx="14" class="k-green" />
  <rect x="584" y="676" width="34" height="34" rx="9.5625" class="tile-green"/>
  <g transform="translate(590.375,682.375) scale(0.8854166666666667)"><path d="M5 21V4 M5 4.5h11l-2 4 2 4H5" class="ico s-green"/></g>
  <text x="630" y="698" class="ttl">Output</text>
  <text x="584" y="736" class="t">· de-duplicated GitHub issues</text>
<text x="584" y="757" class="t">· the root cause fingerprinted</text>
<text x="584" y="778" class="t">· one defect per issue</text>
<text x="584" y="799" class="t">· state under <tspan class="mono">.argus/</tspan></text>
  <rect x="32" y="846" width="856" height="168" rx="14" class="k-red" />
  <rect x="44" y="862" width="34" height="34" rx="9.5625" class="tile-red"/>
  <g transform="translate(50.375,868.375) scale(0.8854166666666667)"><path d="M8.5 3h7L21 8.5v7L15.5 21h-7L3 15.5v-7z M9 9l6 6 M15 9l-6 6" class="ico s-red"/></g>
  <text x="90" y="876" class="t"><tspan class="tb c-red">Hard limits</tspan></text>
  <text x="90" y="900" class="cap">· You test; you don't fix — no product-code edits, commits or PRs.</text>
<text x="90" y="918" class="cap">· Asked to fix mid-cycle → end the cycle first, then hand to /forge in a separate session.</text>
<text x="90" y="936" class="cap">· Dev / local only, seeded accounts only — never production, never real customer or employee data.</text>
<text x="90" y="954" class="cap">· mode=static (servers down) caps every severity at S3 and needs a reachability chain.</text>
<text x="90" y="972" class="cap">· A subagent returns a candidate, never a finding — the orchestrator re-runs the repro itself.</text>
<text x="90" y="990" class="cap">· File only what you'd bet 4:1 a maintainer reproduces — a wrong issue gets implemented.</text>
</svg>
