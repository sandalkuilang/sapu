  <text x="32" y="46" class="eyebrow">AUTONOMOUS QA · /argus</text>
  <text x="32" y="78" class="h1">One bounded QA cycle</text>
  <text x="32" y="102" class="sub">Hunt bugs, business-rule breaks, insider fraud and rendered-surface defects on the live dev app. Test, never fix.</text>
