  <text x="92" y="480" class="t"><tspan class="tb">Auditor</tspan><tspan class="muted"> — </tspan>insider fraud</text>
  <text x="92" y="499" class="cap c-amber">runs every cycle</text>
  <rect x="48" y="520" width="284" height="54" rx="10" class="sunken" />
  <circle cx="70" cy="547" r="13" class="tile-violet"/>
  <text x="70" y="551" class="chipt c-violet" text-anchor="middle">C</text>
  <text x="92" y="542" class="t"><tspan class="tb">Curator</tspan><tspan class="muted"> — </tspan>rendered surface</text>
  <text x="92" y="561" class="cap c-blue">live mode only · measured</text>
  <text x="48" y="618" class="t"><tspan class="tb">+ six bypass classes A–F</tspan>, every cycle</text>
  <rect x="364" y="196" width="524" height="444" rx="14" class="card" filter="url(#sh)"/>
