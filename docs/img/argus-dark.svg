  <text x="90" y="156" class="t"><tspan class="tb">Reads</tspan>  profile <tspan class="mono">.claude/sapu/argus.md</tspan> + <tspan class="mono">.argus/config.yml</tspan> (repo, URLs, seeded accounts, scope, limits)</text>
  <rect x="32" y="196" width="316" height="444" rx="14" class="card" filter="url(#sh)"/>
  <rect x="48" y="212" width="36" height="36" rx="10.125" fill="url(#brand)"/>
  <g transform="translate(54.75,218.75) scale(0.9375)"><path d="M9 4.5a3.5 3.5 0 1 0 0.01 0 M3 20c0-3.6 2.7-6 6-6s6 2.4 6 6 M16.5 5.5a2.8 2.8 0 1 1 0 5.6 M17.5 14.2c2.2.5 3.5 2.6 3.5 5.3" class="ico ico-w"/></g>
  <text x="96" y="228" class="ttl">Council of Five</text>
  <text x="96" y="246" class="cap">each lens owes an output</text>
  <rect x="48" y="272" width="284" height="54" rx="10" class="sunken" />
  <circle cx="70" cy="299" r="13" class="tile-violet"/>
  <text x="70" y="303" class="chipt c-violet" text-anchor="middle">U</text>
  <text x="92" y="304" class="t"><tspan class="tb">User</tspan><tspan class="muted"> — </tspan>interrupted flow</text>
  <rect x="48" y="334" width="284" height="54" rx="10" class="sunken" />
  <circle cx="70" cy="361" r="13" class="tile-violet"/>
  <text x="70" y="365" class="chipt c-violet" text-anchor="middle">PM</text>
