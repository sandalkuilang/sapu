<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 954" width="920" height="954" role="img" aria-label="The senior-dev-team plugin: eight senior agents — product manager, software architect, full-stack developer, database engineer, UI/UX designer, QA analyst, QA reviewer and technical writer — and how sapu dispatches them by role: qa reviews every PR, a qa plus domain-specialist Opus pair reviews the red tier, and a scoped /inspector run adds a read-only team review. A repo can map any role to its own agent.">
  <title>senior-dev-team — eight senior specialists, and how sapu uses them</title>
  <desc>senior-dev-team is a second plugin in the sapu marketplace: eight senior agents, each with one role, a fixed method and a Handoffs section. Product manager (senior-dev-team:product-manager): PRDs, backlog priority, user stories, scope; sapu role product. Software architect (senior-dev-team:senior-software-architect): system design, trade-offs, migrations, ADRs; sapu role architect. Full-stack developer (senior-dev-team:senior-fullstack-developer): features, bug fixes, refactors and tests; sapu role developer. Database engineer (senior-dev-team:senior-fullstack-database-engineer): schemas, safe migrations, slow queries, indexes; sapu role db. UI/UX designer (senior-dev-team:senior-ui-ux-designer): flows, UI critique, tokens, accessibility, UX audits; sapu role ux. QA analyst (senior-dev-team:senior-qa-analyst): executed evidence: API, security, browser E2E; no default sapu role. QA reviewer (senior-dev-team:senior-qa-reviewer): code and diff review with evidence, no browser; sapu role qa. Technical writer (senior-dev-team:senior-technical-writer): READMEs, API references, guides, release notes; sapu role writer. sapu depends on the plugin and calls its specialists by role: the qa specialist reviews every PR at Opus/high and is never its author; a red-tier issue or a red-area diff gets an adversarial Opus pair, qa plus a domain specialist; a scoped /inspector run adds a read-only team review, product and ux in parallel, then qa and tests alone. A repo can map any role to its own agent through the optional specialists field of .claude/sapu.json; roles it does not name keep the default. Every agent runs on Opus at high effort with project-scoped memory, and follows the dispatching prompt's rules: read-only when told, never stops to ask the user, returns the structured output asked for, stays in its worktree.</desc>
