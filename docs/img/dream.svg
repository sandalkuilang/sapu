<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 706" role="img" aria-label="dream runs three phases — deep research into two or three of nine technology domains per run (stalest first, or weighted to a given focus with about 20% outside it), then eight to twelve falsifiable hypotheses each with a cited reasoning chain and a kill condition, then grounding two or three of them into one-month experiments for this project. It modifies no code and opens no issues; its only write is one local report.">
  <title>/dream — forward-looking research, read-only</title>
  <desc>dream runs cold every time and needs no contract; an optional profile names where bug-like findings are routed. Phase 1 (about 40 percent of effort) researches papers and talks, what frontier labs ship, adjacent fields, current failure patterns and GitHub trending in two or three domains per run, rotated through a pool of nine (auth, security, UI/UX, performance, database, hosting, HCI, dashboards, payments) stalest first — or weighted to a given focus with about 20 percent outside it — tagging every claim HAPPENING, EMERGING or EXTRAPOLATION. Phase 2 generates 8 to 12 ideas, each with a cited reasoning chain, the shift, why now, what breaks first, the senior engineer's objection, a concrete artifact, a kill condition and a confidence, then a diversity check. Phase 3 grounds 2 to 3 ideas in this project with architecture impact, a one-month experiment and the cost of being early or late. dream modifies no code and opens no issues; its only write is one local report under dreams/.</desc>
  <style>
    :root{
      --bg:#f4f7fc; --ink:#18212f; --muted:#4d596c; --panel:#ffffff; --panel2:#e9eff9; --edge:#8390a6;
      --reads:#1f5fd6; --writes:#0d7a4d; --limit:#b3261e; --accent:#6a43c8;
      --readsfill:#e3edff; --writesfill:#dcf3e8; --limitfill:#fce8e5; --accentfill:#efe8fc;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#0f1522; --ink:#e8edf7; --muted:#a6b1c4; --panel:#1a2232; --panel2:#232d41; --edge:#5a677e;
        --reads:#86abff; --writes:#62d49a; --limit:#ff8f84; --accent:#c3a9ff;
        --readsfill:#17294a; --writesfill:#10301f; --limitfill:#3b1b18; --accentfill:#261f3d;
      }
    }
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--ink)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .bg{fill:var(--bg)}
    .h{font-size:21px;font-weight:700}
    .sub{font-size:13px;fill:var(--muted)}
    .ttl{font-size:14px;font-weight:700}
    .badge{font-size:12.5px;font-weight:700;fill:var(--accent)}
    .t{font-size:13px}
    .sm{font-size:12.5px;fill:var(--muted)}
    .c-writes{fill:var(--writes)} .c-limit{fill:var(--limit)} .c-accent{fill:var(--accent)}
    .box{fill:var(--panel);stroke:var(--edge);stroke-width:1.4}
    .box2{fill:var(--panel2);stroke:var(--edge);stroke-width:1.2}
    .reads-b{fill:var(--readsfill);stroke:var(--reads);stroke-width:1.5}
    .writes-b{fill:var(--writesfill);stroke:var(--writes);stroke-width:1.5}
    .limit-b{fill:var(--limitfill);stroke:var(--limit);stroke-width:1.5}
    .flow{stroke:var(--ink);stroke-width:2;fill:none}
    .reads{stroke:var(--reads);stroke-width:1.7;fill:none;stroke-dasharray:6 4}
    .writes{stroke:var(--writes);stroke-width:1.8;fill:none}
    .ah-flow{fill:var(--ink)} .ah-reads{fill:var(--reads)} .ah-writes{fill:var(--writes)}
  </style>
  <defs>
    <marker id="af" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" class="ah-flow"/></marker>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" class="ah-reads"/></marker>
    <marker id="aw" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" class="ah-writes"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="920" height="706" rx="16"/>

  <text x="24" y="40" class="h">/dream — where is this heading?</text>
  <text x="24" y="62" class="sub">Deep research → falsifiable hypotheses → near-term experiments for this project. Read-only.</text>

  <!-- legend -->
  <rect x="24" y="80" width="872" height="36" rx="8" class="box"/>
  <line x1="40" y1="98" x2="68" y2="98" class="flow" marker-end="url(#af)"/>
  <text x="76" y="102" class="sm">flow</text>
  <line x1="170" y1="98" x2="198" y2="98" class="reads" marker-end="url(#ar)"/>
  <text x="206" y="102" class="sm">reads</text>
  <line x1="310" y1="98" x2="338" y2="98" class="writes" marker-end="url(#aw)"/>
  <text x="346" y="102" class="sm">produces</text>
  <rect x="460" y="91" width="26" height="14" rx="3" class="limit-b"/>
  <text x="494" y="102" class="sm">hard limit</text>

  <!-- reads -->
  <rect x="24" y="132" width="872" height="40" rx="8" class="reads-b"/>
  <text x="40" y="157" class="t"><tspan class="ttl">Reads</tspan> — optional profile <tspan class="mono">.claude/sapu/dream.md</tspan> (findings routing) + project context · no contract needed</text>
  <path d="M160,172 L160,190" class="reads" marker-end="url(#ar)"/>

  <!-- phase 1 -->
  <rect x="24" y="192" width="272" height="320" rx="10" class="box2"/>
  <text x="40" y="216" class="ttl">Phase 1 · Research</text>
  <text x="280" y="216" class="badge" text-anchor="end">≈ 40%</text>
  <text x="40" y="242" class="sm">sources</text>
  <text x="40" y="262" class="t">· papers and talks, 6–12 months</text>
  <text x="40" y="282" class="t">· what frontier labs ship</text>
  <text x="40" y="302" class="t">· adjacent fields, failures</text>
  <text x="40" y="322" class="t">· GitHub trending + dependents</text>
  <text x="40" y="348" class="sm">domains: 2–3 per run, rotating</text>
  <text x="40" y="368" class="t">auth · security · UI/UX</text>
  <text x="40" y="388" class="t">performance · database · hosting</text>
  <text x="40" y="408" class="t">HCI · dashboards · payments</text>
  <text x="40" y="434" class="sm">every claim tagged</text>
  <text x="40" y="454" class="t">HAPPENING · EMERGING</text>
  <text x="40" y="474" class="t">EXTRAPOLATION — cite or cut</text>
  <text x="40" y="498" class="sm">note contradicting evidence</text>

  <!-- phase 2 -->
  <rect x="324" y="192" width="272" height="320" rx="10" class="box2"/>
  <text x="340" y="216" class="ttl">Phase 2 · Dreaming</text>
  <text x="580" y="216" class="badge" text-anchor="end">8–12 ideas</text>
  <text x="340" y="242" class="sm">each idea carries</text>
  <text x="340" y="262" class="t">· cited reasoning chain</text>
  <text x="340" y="282" class="t">· the shift: before → after</text>
  <text x="340" y="302" class="t">· why now (a named curve)</text>
  <text x="340" y="322" class="t">· what breaks first</text>
  <text x="340" y="342" class="t">· senior engineer's objection</text>
  <text x="340" y="362" class="t">· one concrete artifact</text>
  <text x="340" y="382" class="t">· kill condition (falsifiable)</text>
  <text x="340" y="402" class="t">· confidence</text>
  <text x="340" y="428" class="sm">before output</text>
  <text x="340" y="448" class="t">diversity check</text>
  <text x="340" y="468" class="t">uncited link → cut or downgrade</text>

  <!-- phase 3 -->
  <rect x="624" y="192" width="272" height="320" rx="10" class="box2"/>
  <text x="640" y="216" class="ttl">Phase 3 · Wake-up</text>
  <text x="880" y="216" class="badge" text-anchor="end">2–3 ideas</text>
  <text x="640" y="242" class="sm">grounded in THIS project</text>
  <text x="640" y="262" class="t">· architecture impact</text>
  <text x="654" y="282" class="sm">a real file, skill or service</text>
  <text x="640" y="302" class="t">· one-month experiment</text>
  <text x="654" y="322" class="sm">signal if right / if wrong</text>
  <text x="640" y="342" class="t">· cost of early vs late</text>
  <text x="640" y="368" class="sm">the report also has</text>
  <text x="640" y="388" class="t">· a Conviction paragraph</text>
  <text x="640" y="408" class="t">· Delta vs previous dreams</text>
  <text x="654" y="428" class="sm">+ domain coverage table</text>

  <path d="M296,352 L322,352" class="flow" marker-end="url(#af)"/>
  <path d="M596,352 L622,352" class="flow" marker-end="url(#af)"/>

  <!-- output -->
  <text x="24" y="566" class="sm">/dream [focus] weights research to the focus, ~20% outside</text>
  <path d="M760,512 L760,530" class="writes" marker-end="url(#aw)"/>
  <rect x="544" y="532" width="352" height="56" rx="9" class="writes-b"/>
  <text x="720" y="555" class="t" text-anchor="middle">one local report</text>
  <text x="720" y="575" class="sm mono" text-anchor="middle">dreams/DREAM-{YYYY-MM-DD}[-{focus}].md</text>

  <!-- read-only rail -->
  <rect x="24" y="608" width="872" height="78" rx="10" class="limit-b"/>
  <text x="40" y="630" class="ttl c-limit">Read-only — the hard limit</text>
  <text x="40" y="652" class="t">Modifies no code and opens no issues — its only write is the report above.</text>
  <text x="40" y="672" class="t">A bug-like finding is named in prose and pointed at the project's QA skill (e.g. /argus); never filed.</text>
</svg>
