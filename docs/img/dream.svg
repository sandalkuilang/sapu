<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 884" width="920" height="884" role="img" aria-label="dream runs three phases — deep research into two or three of nine technology domains per run (stalest first, or weighted to a given focus with about 20% outside it), then eight to twelve falsifiable hypotheses each with a cited reasoning chain and a kill condition, then grounding two or three of them into one-month experiments for this project. It modifies no code and opens no issues; its only write is one local report.">
  <title>/dream — forward-looking research, read-only</title>
  <desc>dream runs cold every time and needs no contract; an optional profile names where bug-like findings are routed. Phase 1 (about 40 percent of effort) researches papers and talks, what frontier labs ship, adjacent fields, current failure patterns and GitHub trending in two or three domains per run, rotated through a pool of nine (auth, security, UI/UX, performance, database, hosting, HCI, dashboards, payments) stalest first — or weighted to a given focus with about 20 percent outside it — tagging every claim HAPPENING, EMERGING or EXTRAPOLATION. Phase 2 generates 8 to 12 ideas, each with a cited reasoning chain, the shift, why now, what breaks first, the senior engineer's objection, a concrete artifact, a kill condition and a confidence, then a diversity check. Phase 3 grounds 2 to 3 ideas in this project with architecture impact, a one-month experiment and the cost of being early or late. dream modifies no code and opens no issues; its only write is one local report under dreams/.</desc>
