# Tags and releases every version: a push to main that changes the plugin's version gets the
# lightweight tag v<version> on that commit and a GitHub Release marked Latest, so a version can
# never ship untagged (2.2.9 once did) or leave the Releases page on an older one (2.2.8 stayed
# "Latest" through 2.2.12).
name: tag-release
on:
  push:
    branches: [main]
    paths: [plugins/sapu/.claude-plugin/plugin.json]
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag v<version> unless it exists
        run: |
          v="v$(jq -r .version plugins/sapu/.claude-plugin/plugin.json)"
          if git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null; then echo "$v already tagged"; exit 0; fi
          git tag "$v" "$GITHUB_SHA"
          git push origin "$v"
      - name: Release v<version> unless it exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(jq -r .version plugins/sapu/.claude-plugin/plugin.json)"
          gh release view "$v" >/dev/null 2>&1 && { echo "$v already released"; exit 0; }
          gh release create "$v" --title "$v" --generate-notes --latest
