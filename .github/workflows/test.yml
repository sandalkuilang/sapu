# Runs the test suite on Linux and on macOS for a pull request that is ready for review: a draft runs
# nothing, marking it ready runs it, and each later push to it runs it again, cancelling the run it
# replaces. A maintainer can also run it by hand (workflow_dispatch). The journey lane's live
# instance takes different paths on each (process start times from /proc or ps, unix-socket peers from
# `ss -xp` or lsof, dash or bash as /bin/sh, Chrome's socket paths), so each job runs on both.
#
# The suite is split into parallel jobs: a file that starts Chrome takes minutes, and one job running
# them all outgrew its 30 minutes. Each matrix entry's `files:` line names its test files; the `rest`
# job runs every file no `files:` line names, so a new test file runs there by default. A file named
# on two lines, or one that is gone, fails the `rest` job.
name: test
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    name: test (${{ matrix.os }}, ${{ matrix.job }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        job: [repro, oracles, browser, paths-perf, generated-suite, taste, rest]
        include:
          - job: repro
            files: tests/argus-live-repro.test.ts
          - job: oracles
            files: tests/argus-live-oracles.test.ts
          - job: browser
            files: tests/argus-live-browser.test.ts tests/argus-live-pw.test.ts
          - job: paths-perf
            files: tests/argus-live-paths.test.ts tests/argus-live-perf.test.ts
          - job: generated-suite
            files: tests/argus-live-codegen.test.ts tests/argus-live-a11y.test.ts tests/argus-live-layout.test.ts
          - job: taste
            files: tests/argus-live-tastejudge.test.ts tests/argus-live-tasteprobe.test.ts tests/argus-live-ease.test.ts tests/argus-live-tasteflow.test.ts tests/taste-calibrate.test.ts tests/taste-calibrate-local.test.ts tests/argus-live-aiux.test.ts
          - job: rest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # package.json's engines: node >= 22.18
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The job's test files
        if: matrix.job != 'rest'
        env:
          FILES: ${{ matrix.files }}
        run: npx vitest run $FILES
      - name: The live instance's tests
        if: matrix.job == 'rest'
        run: npx vitest run tests/argus-live.test.ts
      - name: The rest of the suite
        if: matrix.job == 'rest'
        run: |
          listed=$(sed -nE 's/^ *files: *//p' .github/workflows/test.yml | tr ' ' '\n' | grep .)
          twice=$(printf '%s\n' "$listed" | sort | uniq -d)
          if [ -n "$twice" ]; then echo "named on more than one files: line: $twice"; exit 1; fi
          for f in $listed; do [ -f "$f" ] || { echo "named on a files: line but not there: $f"; exit 1; }; done
          npx vitest run --exclude tests/argus-live.test.ts $(printf -- '--exclude %s ' $listed)
