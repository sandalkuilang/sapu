<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>New contact</title></head>
<body>
<main>
<h1>New contact</h1>
<!-- The app validates (novalidate): a submit with an empty name is refused with a message. In mode "clear"
     the refusal also empties every other field; in mode "keep" it keeps them; in mode "native" the browser
     validates the form itself and never submits it. -->
<form id="f" novalidate>
  <label>Name <input name="name" required></label>
  <label>Email <input name="email" type="email"></label>
  <label>Notes <textarea name="notes"></textarea></label>
  <label><input type="checkbox" name="vip"> VIP</label>
  <p id="err" role="alert"></p>
  <button>Save contact</button>
</form>
<p id="done" role="status"></p>
</main>
<script>
  const mode = "__MODE__";
  const f = document.getElementById("f");
  if (mode === "native") f.noValidate = false;
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!f.elements.name.value) {
      document.getElementById("err").textContent = "Enter a name.";
      if (mode === "clear") { f.elements.email.value = ""; f.elements.notes.value = ""; f.elements.vip.checked = false; }
      return;
    }
    await fetch("/api/save?ms=10", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name: f.elements.name.value }) });
    document.getElementById("done").textContent = "Contact saved.";
  });
</script>
</body></html>
