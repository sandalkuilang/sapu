<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Covered controls</title></head>
<body style="margin:0">
<header style="position:fixed;z-index:10;top:0;left:0;right:0;height:50px;background:white">Shop</header>
<main style="position:relative;padding-top:70px">
<h1>Checkout</h1>
<!-- the violation: a plain overlay sits on the pay button -->
<div style="position:relative;width:200px;height:40px">
<button id="pay" style="width:120px;height:30px">Pay now</button>
<div id="overlay" style="position:absolute;left:0;top:0;width:120px;height:30px;background:rgb(255,200,200)"></div>
</div>
<!-- the excluded twin: a custom checkbox whose own label draws over the native input -->
<label id="box" style="position:relative;display:inline-block;width:24px;height:24px;margin-top:20px">
<input id="native" type="checkbox" aria-label="Agree" style="position:absolute;left:0;top:0;width:24px;height:24px;margin:0">
<span style="position:absolute;left:0;top:0;width:24px;height:24px;background:rgb(200,200,200)"></span>
</label>
</main>
<!-- the excluded twin: a control under the fixed header is a scroll-position artifact -->
<button id="behind" style="position:absolute;top:10px;left:300px">Behind header</button>
</body></html>
