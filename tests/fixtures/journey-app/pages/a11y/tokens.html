<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tokens</title>
<style>
  body { margin: 0; padding: 16px; font: 1rem Helvetica, Arial, sans-serif; background: #ffffff; color: #0b1b3a; }
  button, a, input, select, textarea { font-family: Helvetica, Arial, sans-serif; font-size: 1rem; color: #0b1b3a; background-color: #ffffff; margin: 4px; }
  button.brand { background-color: #0b5fff; color: #ffffff; }
  button.offcolor { color: rgb(254, 1, 1); }
  button.offbg { background-color: rgb(250, 235, 215); }
  button.offfont { font-family: Georgia, serif; }
  button.offsize { font-size: 21px; }
  a { background-color: transparent; }
</style>
</head>
<body>
<main>
  <button class="brand">On token</button>
  <button class="offcolor">Off colour</button>
  <button class="offbg">Off background</button>
  <button class="offfont">Off font</button>
  <button class="offsize">Off size</button>
  <a href="/terms">Terms</a>
  <input aria-label="Search">
  <button class="offcolor" hidden>Hidden off colour</button>
</main>
</body>
</html>
