<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sticky footer</title>
<style>
  body { margin: 0; padding: 16px; font: 16px sans-serif; }
  .spacer { height: 1500px; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; height: 120px; background: rgb(34, 34, 51); color: #fff; padding: 16px; }
  :focus-visible { outline: 3px solid #1a4fd6; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="spacer"></div>
  <button>Low button</button>
  <div class="spacer" style="height: 40px"></div>
</main>
<footer>Cookie banner</footer>
</body>
</html>
