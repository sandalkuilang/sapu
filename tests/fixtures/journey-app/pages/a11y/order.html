<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab order</title>
<style>
  body { margin: 0; padding: 16px; font: 16px sans-serif; }
  :focus-visible { outline: 3px solid #1a4fd6; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <button>Alpha</button>
  <button>Beta</button>
  <button tabindex="3">Gamma</button>
</main>
</body>
</html>
