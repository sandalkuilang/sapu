<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Payments</title>
<style>

body { font: 400 16px/24px sans-serif; color: rgb(23, 23, 23); background: rgb(255, 255, 255); }

.blue { background: rgb(37, 99, 235); }
.amber { background: rgb(217, 119, 6); }
a { color: rgb(37, 99, 235); }
</style></head>
<body>
<main><h1>Payments</h1>
<!-- the violation on one screen: one status in two colours -->
<p>Payment one <span class="badge green">Paid</span></p>
<p>Payment two <span class="badge blue">PAID</span></p>
<p>Payment three <span class="badge green">Paid</span></p>
</main>
</body></html>
