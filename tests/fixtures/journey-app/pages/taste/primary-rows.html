<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>One action, repeated</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; border: 0 solid; }
body { font: 400 16px/24px sans-serif; color: rgb(23, 23, 23); background: rgb(255, 255, 255); }
button { font: 500 14px/20px sans-serif; padding: 8px 16px; border-radius: 6px; margin: 8px; }
.fill { color: rgb(255, 255, 255); background: rgb(37, 99, 235); }
.line { color: rgb(23, 23, 23); background: transparent; border: 1px solid rgb(212, 212, 212); }
.pale { color: rgb(23, 23, 23); background: rgb(244, 244, 245); }
</style></head>
<body>
<!-- the excluded twin: the same primary action repeated on each row is one action -->
<main><h1>Invoices</h1>
<ul><li>Invoice one <button class="fill">Pay</button></li><li>Invoice two <button class="fill">Pay</button></li><li>Invoice three <button class="fill">Pay</button></li></ul>
</main>
</body></html>
