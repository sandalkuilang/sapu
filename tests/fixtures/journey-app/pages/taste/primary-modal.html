<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>A modal's own view</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; border: 0 solid; }
body { font: 400 16px/24px sans-serif; color: rgb(23, 23, 23); background: rgb(255, 255, 255); }
button { font: 500 14px/20px sans-serif; padding: 8px 16px; border-radius: 6px; margin: 8px; }
.fill { color: rgb(255, 255, 255); background: rgb(37, 99, 235); }
.line { color: rgb(23, 23, 23); background: transparent; border: 1px solid rgb(212, 212, 212); }
.pale { color: rgb(23, 23, 23); background: rgb(244, 244, 245); }
dialog { padding: 24px; }
</style></head>
<body>
<!-- the excluded twin: while a modal dialog is open, only its own actions are the view -->
<main><h1>Draft</h1><button class="fill">Save</button><button class="fill">Publish</button></main>
<dialog id="d"><p>Delete the draft?</p><button class="fill">Confirm</button><button class="line">Cancel</button></dialog>
<script>document.getElementById("d").showModal();</script>
</body></html>
