<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Nested radii</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; border: 0 solid; }
body { font: 400 16px/24px sans-serif; color: rgb(23, 23, 23); background: rgb(255, 255, 255); }
.box { width: 220px; margin: 24px; border-radius: 8px; background: rgb(229, 229, 229); }
.inner { height: 60px; background: rgb(37, 99, 235); color: rgb(255, 255, 255); }
</style></head>
<body>
<main>
<!-- the violation: a child flush in its parent's corner, more rounded than the parent -->
<div class="box"><div class="inner" style="border-radius: 16px">Flush child</div></div>
<!-- the excluded twin: the same child inset by padding shares no corner -->
<div class="box" style="padding: 24px"><div class="inner" style="border-radius: 16px">Inset child</div></div>
<!-- the excluded twin: a circle is a shape, not a corner treatment -->
<div class="box"><div class="inner" style="width: 40px; height: 40px; border-radius: 50%">AB</div></div>
<!-- the excluded twin: a smaller child radius -->
<div class="box" style="border-radius: 12px; padding: 4px"><div class="inner" style="border-radius: 8px">Smaller child</div></div>
</main>
</body></html>
