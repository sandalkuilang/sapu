<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Eleven spacing values</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; border: 0 solid; }
body { font: 400 16px/24px sans-serif; color: rgb(23, 23, 23); background: rgb(255, 255, 255); }
</style></head>
<body>
<!-- eleven distinct spacing values: 30, 3, 5, 7, 10, 13, 18, 8, 16, 22, 26 (only 8 and 16 are on a 4 px scale) -->
<main style="padding: 30px">
<div style="padding: 3px">Alpha</div>
<div style="padding: 5px 7px">Bravo</div>
<div style="margin-top: 10px">Charlie</div>
<div style="padding: 13px">Delta</div>
<div style="display: flex; gap: 18px"><span>Echo</span><span>Foxtrot</span></div>
<div style="padding: 8px 16px">Golf</div>
<div style="margin-bottom: 22px">Hotel</div>
<div style="padding-left: 26px">India</div>
</main>
</body></html>
