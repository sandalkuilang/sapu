<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>A hand-counted census</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; border: 0 solid; }
body { font: 400 16px/24px sans-serif; color: rgb(23, 23, 23); background: rgb(255, 255, 255); }
h1 { font: 700 32px/40px sans-serif; }
h2 { font: 600 20px/28px sans-serif; }
small { font: 400 12px/16px sans-serif; color: rgb(115, 115, 115); }
a { font: 500 16px/24px sans-serif; color: rgb(37, 99, 235); }
button { font: 500 14px/20px sans-serif; color: rgb(255, 255, 255); background: rgb(37, 99, 235); border-radius: 6px; padding: 8px 16px; }
.badge { font: 500 12px/16px sans-serif; color: rgb(255, 255, 255); border-radius: 9999px; padding: 2px 8px; }
.ok { background: rgb(22, 163, 74); }
.warn { background: rgb(217, 119, 6); }
.card { border: 1px solid rgb(229, 229, 229); border-radius: 12px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05); padding: 16px; margin: 16px; }
.pop { position: absolute; top: 8px; right: 8px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12); padding: 8px; background: rgb(255, 255, 255); }
</style></head>
<body>
<!-- type (size x weight): 32/700, 20/600, 16/400, 12/400, 16/500, 14/500, 12/500 = 7; weights 700, 600, 400, 500 = 4;
     non-neutral colours: the blue (link ink and button fill), the green, the amber = 3; radii 6, 12, full = 3; shadows 2 -->
<div class="card">
<h1>Billing</h1>
<h2>This month</h2>
<p>Your plan renews on the first.</p>
<p><small>Taxes included</small> <a href="/plans">Change plan</a></p>
<p><span class="badge ok">Paid</span> <span class="badge warn">Pending</span></p>
<button type="button">Pay now</button>
</div>
<div class="pop">Saved</div>
</body></html>
