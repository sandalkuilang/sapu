<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Orders</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; border: 0 solid; }
body { font: 400 16px/24px sans-serif; color: rgb(23, 23, 23); background: rgb(255, 255, 255); }
main { padding: 24px; }
.badge { display: inline-block; font: 500 12px/16px sans-serif; color: rgb(255, 255, 255); border-radius: 9999px; padding: 2px 8px; margin: 4px; }
.green { background: rgb(22, 163, 74); }
.blue { background: rgb(37, 99, 235); }
.amber { background: rgb(217, 119, 6); }
a { color: rgb(37, 99, 235); }
</style></head>
<body>
<main><h1>Orders</h1>
<p>Order one <span class="badge green">Paid</span></p>
<p>Order two <span class="badge amber">Pending</span></p>
<!-- the excluded twin: a link that reads like the status is a control, not a status badge -->
<p><a href="/paid">Paid</a></p>
</main>
</body></html>
