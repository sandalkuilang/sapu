default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: 127.0.0.1
  port: 3307

development:
  <<: *default
  database: shop_development

test:
  <<: *default
  database: shop_test<%= ENV['TEST_ENV_NUMBER'] %>

production:
  <<: *default
  database: shop_production
